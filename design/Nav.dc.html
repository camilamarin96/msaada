<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Msaada navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;600;700&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<a href="#main" class="skip" style="position: absolute; left: -9999px; top: 8px; z-index: 100; padding: 12px 18px; background: #0E4D2C; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; border-radius: 999px; text-decoration: none">Skip to content</a>
<header style="background: #FFFFFF; border-bottom: 1px solid #DCE6DE; font-family: 'Figtree', system-ui, sans-serif; color: #142019">
<nav aria-label="Main" class="nav-bar" style="max-width: 1344px; margin: 0 auto; min-height: 96px; box-sizing: border-box; padding: 0 clamp(16px, 3vw, 48px); display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="Main.dc.html" aria-label="Msaada home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0">
<img class="nav-logo" src="../img/4d51babe60444382b6baa03338f8e928.png" alt="Msaada: When you give it, when you need it" style="height: 72px; width: auto; display: block">
</a>
<ul class="nav-links" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: clamp(8px, 1.6vw, 28px)">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
<li><a href="{{ l.href }}" aria-current="{{ l.current }}" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 16px; text-decoration: none; white-space: nowrap; border-bottom: 3px solid {{ l.line }}; color: {{ l.color }}">{{ l.label }}</a></li>
</sc-for>
</ul>
<div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<a href="https://wa.me/256795845815?text=Hello%20Msaada%2C%20I%20would%20like%20to%20donate%20some%20items." class="btn btn-red nav-cta" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; background: #D62828; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none; border-radius: 999px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"></path></svg>Donate<span class="nav-cta-more">&nbsp;on WhatsApp</span></a>
<button type="button" class="nav-toggle" onClick="{{ toggle }}" aria-label="{{ toggleLabel }}" aria-expanded="{{ open }}" style="display: none; align-items: center; justify-content: center; width: 48px; height: 48px; border: 2px solid #0E4D2C; background: #FFFFFF; color: #0E4D2C; border-radius: 50%; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>
</nav>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<ul style="list-style: none; margin: 0; padding: 8px clamp(16px, 3vw, 48px) 20px; display: flex; flex-direction: column; border-top: 1px solid #DCE6DE; background: #FFFFFF">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
<li><a href="{{ l.href }}" aria-current="{{ l.current }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; text-decoration: none; border-bottom: 1px solid #E8F2EA; color: {{ l.color }}">{{ l.label }}<sc-if value="{{ l.isActive }}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #FFFFFF; background: #D62828; padding: 3px 10px; border-radius: 999px">You are here</span></sc-if></a></li>
</sc-for>
</ul>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","sessions","donate","process","contact"],"default":"home"},"$preview":{"width":1440,"height":96}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      ['about', 'About us', 'About.dc.html'],
      ['sessions', 'Sessions', 'Sessions.dc.html'],
      ['donate', 'What can you donate?', 'Donate.dc.html'],
      ['process', 'Our process', 'Process.dc.html'],
      ['contact', 'Contact', 'Contact.dc.html']
    ];
    const links = items.map(([id, label, href]) => ({
      label: label,
      href: href,
      current: id === active ? 'page' : 'false',
      color: id === active ? '#0E4D2C' : '#33443A',
      line: id === active ? '#D62828' : 'transparent',
      isActive: id === active
    }));
    const open = this.state.open;
    return {
      links: links,
      open: open,
      toggleLabel: open ? 'Close menu' : 'Open menu',
      toggle: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
