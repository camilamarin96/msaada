(function(){
  var DATA = {"comps": {"Main": {"tpl": "<div style=\"min-height: 100vh; display: flex; flex-direction: column\">\n\n<div style=\"position: sticky; top: 0; z-index: 50\">\n<dc-import name=\"Nav\" active=\"home\" hint-size=\"100%,96px\"><\/dc-import>\n<\/div>\n\n<main id=\"main\" tabindex=\"-1\" style=\"outline: none\">\n\n<!-- HERO -->\n<section style=\"position: relative; overflow: hidden; padding: clamp(40px, 6vw, 88px) clamp(20px, 5vw, 72px) clamp(56px, 7vw, 104px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(40px, 5vw, 72px); align-items: center\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(46px, 7vw, 100px); line-height: .95; letter-spacing: -.04em; color: #0E4D2C\">Give what you don\u2019t need. We\u2019ll make it <span style=\"position: relative; display: inline-block; color: #D62828\">useful again<svg viewBox=\"0 0 300 24\" preserveAspectRatio=\"none\" aria-hidden=\"true\" style=\"position: absolute; left: 0; bottom: -10px; width: 100%; height: 18px\"><path d=\"M4 16 C 70 6, 170 4, 296 12\" stroke=\"#D62828\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"><\/path><\/svg><\/span>.<\/h1>\n<p style=\"margin: 0; max-width: 520px; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.55; color: #33443A\">We collect the things you no longer use, young people repair them, and they go to families in and around the settlement.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center\">\n<a href=\"https://wa.me/256795845815?text=Hello%20Msaada%2C%20I%20would%20like%20to%20donate%20some%20items.\" class=\"btn btn-red\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; background: #D62828; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: 999px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19z\"><\/path><path d=\"M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z\"><\/path><\/svg>Arrange on WhatsApp<\/a>\n<a href=\"Process.dc.html\" class=\"btn btn-line\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border: 2px solid #0E4D2C; color: #0E4D2C; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: 999px\">See how it works<\/a>\n<\/div>\n<p style=\"margin: -12px 0 0; font-size: 16px; color: #33443A\">or call <a href=\"tel:+256795845815\" style=\"font-weight: 700; text-underline-offset: 4px\">0795 845 815<\/a><\/p>\n<p style=\"margin: 6px 0 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; color: #0E4D2C; transform: rotate(-2deg); transform-origin: left\">When you give it <span style=\"color: #D62828\">\u2665<\/span> when you need it<\/p>\n<\/div>\n\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; justify-content: center\">\n<div style=\"position: relative; width: min(560px, 100%); aspect-ratio: 1 / 1\">\n<svg class=\"spin\" viewBox=\"0 0 200 200\" fill=\"none\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\">\n<defs>\n<marker id=\"hA\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#0E4D2C\"><\/path><\/marker>\n<marker id=\"hB\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#D62828\"><\/path><\/marker>\n<\/defs>\n<path d=\"M113.9 4.5 A96 96 0 0 1 188 128\" stroke=\"#0E4D2C\" stroke-width=\"2.4\" stroke-linecap=\"round\" marker-end=\"url(#hA)\"><\/path>\n<path d=\"M170 162 A96 96 0 0 1 30 162\" stroke=\"#D62828\" stroke-width=\"2.4\" stroke-linecap=\"round\" marker-end=\"url(#hB)\"><\/path>\n<path d=\"M12 128 A96 96 0 0 1 86 4.5\" stroke=\"#0E4D2C\" stroke-width=\"2.4\" stroke-linecap=\"round\" marker-end=\"url(#hA)\"><\/path>\n<\/svg>\n<figure style=\"position: absolute; inset: 9%; margin: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #E3EDE5\"><img src=\"img/4a53518eb526001bf5c18ee38aa3a7d2.jpg\" alt=\"Two young men in yellow shirts carrying a full sack of items across open ground\" fetchpriority=\"high\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block\"><\/figure>\n<figure style=\"position: absolute; right: -2%; top: 2%; width: 34%; aspect-ratio: 4 / 5; margin: 0; border: 6px solid #FAF7F0; display: flex; align-items: flex-end; overflow: hidden; background: #E3EDE5\"><img src=\"img/298db25976508a68f138263b06ce6ad6.jpg\" alt=\"A young woman soldering an electronic circuit at an outdoor table\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 50%; display: block\"><\/figure>\n<div style=\"position: absolute; left: 0; bottom: 4%; width: 30%; aspect-ratio: 1 / 1; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #FAF7F0\">\n<img src=\"img/0214d3a08d3e3db48aa07c163e5da099.png\" alt=\"Msaada two-hands symbol\" style=\"width: 70%; height: auto\">\n<\/div>\n<p style=\"position: absolute; right: 2%; bottom: 8%; margin: 0; padding: 10px 16px; background: #0E4D2C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; transform: rotate(-4deg)\">Collect \u00b7 Repair \u00b7 Redistribute<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- WORD BAND -->\n<section aria-label=\"What we do\" style=\"background: #0E4D2C; color: #FFFFFF; padding: 22px clamp(20px, 5vw, 72px); overflow: hidden\">\n<p style=\"margin: 0 auto; max-width: 1296px; display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: space-between; align-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(22px, 2.6vw, 36px); letter-spacing: -.01em\">\n<span>Reuse<\/span><span style=\"color: #FF6B6B\" aria-hidden=\"true\">\u21bb<\/span><span>Repair<\/span><span style=\"color: #FF6B6B\" aria-hidden=\"true\">\u21bb<\/span><span>Recycle<\/span><span style=\"color: #FF6B6B\" aria-hidden=\"true\">\u21bb<\/span><span>Support<\/span><span style=\"color: #FF6B6B\" aria-hidden=\"true\">\u21bb<\/span><span>Empower<\/span>\n<\/p>\n<\/section>\n\n<!-- PILLARS -->\n<section style=\"padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end\">\n<h2 style=\"margin: 0; max-width: 720px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">One donation. Three kinds of value.<\/h2>\n<p style=\"margin: 0; max-width: 380px; font-size: 17px; line-height: 1.6; color: #4A5A50\">Every item that comes through Msaada does good for the planet, for people and for the young people who repair it.<\/p>\n<\/div>\n<div class=\"pillars\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border-top: 2px solid #0E4D2C\">\n<article class=\"pillar\" style=\"padding: 36px 32px 8px 0; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #C9D9CD\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"width: 64px; height: 64px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 0 1-13.7 5.7\"><\/path><path d=\"M4 12a8 8 0 0 1 13.7-5.7\"><\/path><path d=\"M18 3v4h-4\"><\/path><path d=\"M6 21v-4h4\"><\/path><\/svg><\/span><\/div>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #0E4D2C\">Reduce waste<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #33443A\">Useful things get a second life instead of being thrown away.<\/p>\n<\/article>\n<article class=\"pillar\" style=\"padding: 36px 32px 8px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #C9D9CD\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"width: 64px; height: 64px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\/path><\/svg><\/span><\/div>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #0E4D2C\">Support people<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #33443A\">Families and neighbours who need everyday essentials can get them more easily.<\/p>\n<\/article>\n<article class=\"pillar\" style=\"padding: 36px 0 8px 32px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"width: 64px; height: 64px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21v-8\"><\/path><path d=\"M12 13c0-4 3-6 7-6 0 4-3 6-7 6z\"><\/path><path d=\"M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z\"><\/path><\/svg><\/span><\/div>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; color: #0E4D2C\">Create opportunities<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #33443A\">Young people learn repair skills that can lead to work.<\/p>\n<\/article>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- INTRO -->\n<section style=\"background: #E8F2EA; padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px); position: relative; overflow: hidden\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px); align-items: center\">\n<div style=\"flex: 1 1 440px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<figure style=\"grid-column: span 2; margin: 0; aspect-ratio: 16 / 9; display: flex; align-items: flex-end; position: relative; overflow: hidden; background: #E3EDE5\"><img src=\"img/d37f37e091e692ab7cd18042a6d3b5cc.jpg\" alt=\"A pile of donated clothes in many colours, waiting to be sorted\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block\"><\/figure>\n<figure style=\"margin: 0; aspect-ratio: 1 / 1; display: flex; align-items: flex-end; position: relative; overflow: hidden; background: #E3EDE5\"><img src=\"img/3cb760b097869840822087dba34f23f8.jpg\" alt=\"A small shop with clothes on hangers and a tailor at work\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block\"><\/figure>\n<div style=\"aspect-ratio: 1 / 1; background: #D62828; color: #FFFFFF; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between\">\n<svg width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 0 1-13.7 5.7\"><\/path><path d=\"M4 12a8 8 0 0 1 13.7-5.7\"><\/path><path d=\"M18 3v4h-4\"><\/path><path d=\"M6 21v-4h4\"><\/path><\/svg>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.15\">Good items, brighter futures.<\/p>\n<\/div>\n<\/div>\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">A circle where nothing useful goes to waste.<\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #26372D\">Msaada is a circular community support initiative that collects useful items people no longer need, repairs and reuses them, and redistributes or sells them at affordable prices to refugees and host community members.<\/p>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #26372D\">Along the way, less gets thrown away and young people learn a trade by repairing what comes in.<\/p>\n<p style=\"margin: 0; padding-left: 16px; border-left: 3px solid #D62828; font-size: 15px; line-height: 1.5; color: #4A5A50\"><strong style=\"color: #0E4D2C\">Msaada \u00b7 \u0645\u0633\u0627\u0639\u062f\u0629<\/strong> means \u201chelp\u201d in Swahili and Arabic.<\/p>\n<a href=\"About.dc.html\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; font-size: 17px; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px\">More about us<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/a>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- PROCESS PREVIEW -->\n<section style=\"background: #0A3820; color: #FFFFFF; padding: clamp(72px, 9vw, 140px) clamp(20px, 5vw, 72px); position: relative; overflow: hidden\">\n<svg viewBox=\"0 0 200 200\" fill=\"none\" aria-hidden=\"true\" style=\"position: absolute; right: -160px; top: -160px; width: 520px; height: 520px; opacity: .12\"><circle cx=\"100\" cy=\"100\" r=\"90\" stroke=\"#FFFFFF\" stroke-width=\"1\" stroke-dasharray=\"4 6\"><\/circle><circle cx=\"100\" cy=\"100\" r=\"60\" stroke=\"#FFFFFF\" stroke-width=\"1\"><\/circle><\/svg>\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px); align-items: center; position: relative\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 6.4vw, 96px); line-height: .92; letter-spacing: -.04em\">Eight steps.<br><span style=\"color: #FF8A8A\">One circle.<\/span><\/h2>\n<p style=\"margin: 0; max-width: 420px; font-size: 18px; line-height: 1.6; color: #CFE2D4\">Every donation travels the same loop, from your first message to the collection it helps pay for.<\/p>\n<div><a href=\"Process.dc.html\" class=\"btn btn-white\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; background: #FFFFFF; color: #0A3820; font-weight: 700; text-decoration: none; border-radius: 999px\">See the full process<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/a><\/div>\n<\/div>\n<div style=\"flex: 1.4 1 520px; min-width: 0; display: flex; justify-content: center\">\n<div class=\"loop\" style=\"position: relative; width: min(640px, 100%); aspect-ratio: 1 / 1\">\n<svg viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\"><defs><marker id=\"loopA\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#D62828\"><\/path><\/marker><\/defs><circle cx=\"50\" cy=\"50\" r=\"36\" stroke=\"rgba(255,255,255,.35)\" stroke-width=\".5\" stroke-dasharray=\"1.2 1.8\"><\/circle><path d=\"M 27.84 21.63 A 36 36 0 0 1 42.52 14.79\" stroke=\"#D62828\" stroke-width=\"1\" stroke-linecap=\"round\" marker-end=\"url(#loopA)\"><\/path><\/svg>\n<p style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44%; margin: 0; text-align: center; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.1; color: #FFD6D6\">\u2026and the circle starts again.<\/p>\n<ol aria-label=\"The eight Msaada steps\" style=\"list-style: none; margin: 0; padding: 0\">\n<li style=\"position: absolute; left: 50.0%; top: 14.0%; width: 140px; transform: translate(-50%, -28px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\"><span style=\"width: 56px; height: 56px; border-radius: 50%; background: #D62828; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 0 0 6px #0A3820\">1<\/span><span style=\"font-weight: 700; font-size: 15px; line-height: 1.3; color: #FFFFFF\">You contact us<\/span><\/li>\n<li style=\"position: absolute; left: 75.5%; top: 24.5%; width: 140px; transform: translate(-50%, -28px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\"><span style=\"width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; color: #0A3820; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 0 0 6px #0A3820\">2<\/span><span style=\"font-weight: 700; font-size: 15px; line-height: 1.3; color: #FFFFFF\">We collect<\/span><\/li>\n<li style=\"position: absolute; left: 86.0%; top: 50.0%; width: 140px; transform: translate(-50%, -28px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\"><span style=\"width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; color: #0A3820; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 0 0 6px #0A3820\">3<\/span><span style=\"font-weight: 700; font-size: 15px; line-height: 1.3; color: #FFFFFF\">We receive and sort<\/span><\/li>\n<li style=\"position: absolute; left: 75.5%; top: 75.5%; width: 140px; transform: translate(-50%, -28px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\"><span style=\"width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; color: #0A3820; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 0 0 6px #0A3820\">4<\/span><span style=\"font-weight: 700; font-size: 15px; line-height: 1.3; color: #FFFFFF\">Transport to the Msaada store<\/span><\/li>\n<li style=\"position: absolute; left: 50.0%; top: 86.0%; width: 140px; transform: translate(-50%, -28px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\"><span style=\"width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; color: #0 pan><span style=\"font-weight: 700; font-size: 15px; line-height: 1.3; color: #FFFFFF\">Income supports the next collection<\/span><\/li>\n<\/ol>\n<\/div>\n<\/div>\n<div class=\"loop-list\" style=\"display: none; flex: 1 1 100%; flex-direction: column; gap: 32px\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 32px 0; position: relative\">\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35); padding-top: 0\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #D62828; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">1<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">You contact us<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">2<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">We collect<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">3<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">We receive and sort<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">4<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">Transport to the Msaada store<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">5<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">Youth repair and prepare<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">6<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">Msaada store<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding-right: 16px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #0A3820; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">7<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">Affordable sale or redistribution<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 14px; border-top: 2px dashed rgba(255,255,255,.35)\"><span style=\"margin-top: -24px; width: 46px; height: 46px; border-radius: 50%; background: #D62828; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center\">8<\/span><span style=\"font-weight: 700; font-size: 17px; line-height: 1.3\">Income supports the next collection<\/span><\/li>\n<\/ol>\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; color: #FFD6D6\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 0 1-13.7 5.7\"><\/path><path d=\"M4 12a8 8 0 0 1 13.7-5.7\"><\/path><path d=\"M18 3v4h-4\"><\/path><path d=\"M6 21v-4h4\"><\/path><\/svg>\u2026and the circle starts again.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- DONATE TEASER -->\n<section style=\"padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">From laptops to blankets: <span style=\"color: #D62828\">what we accept.<\/span><\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #33443A\">We take laptops, phones, blankets, books, toys and more, new or used, as long as someone can repair, reuse or pass them on.<\/p>\n<a href=\"Donate.dc.html\" class=\"btn btn-line\" style=\"align-self: flex-start; display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border: 2px solid #0E4D2C; color: #0E4D2C; font-weight: 700; text-decoration: none; border-radius: 999px\">See what you can donate<\/a>\n<\/div>\n<ul style=\"flex: 1.4 1 520px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px\">\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Electronics<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Mobile phones<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Shoes<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Clothes<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Blankets &amp; textiles<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Furniture<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Beds &amp; mattresses<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Kitchen utensils<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Textbooks<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Exercise books<\/li>\n<li style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: #FFFFFF; border: 1.5px solid #C9D9CD; border-radius: 999px; font-weight: 600; color: #0E4D2C\">Children\u2019s toys<\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- FINAL CTA -->\n<section style=\"padding: 0 clamp(20px, 5vw, 72px) clamp(64px, 8vw, 120px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; background: #D62828; color: #FFFFFF; position: relative; overflow: hidden; padding: clamp(40px, 6vw, 88px); display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: space-between\">\n<svg viewBox=\"0 0 200 200\" fill=\"none\" aria-hidden=\"true\" style=\"position: absolute; right: -80px; bottom: -120px; width: 420px; height: 420px; opacity: .18\"><path d=\"M100 20 A80 80 0 1 1 30 140\" stroke=\"#FFFFFF\" stroke-width=\"10\" stroke-linecap=\"round\"><\/path><path d=\"M14 124 L30 142 L50 128\" stroke=\"#FFFFFF\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px; position: relative\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(38px, 5vw, 72px); line-height: .98; letter-spacing: -.035em\">Become part of the circle.<\/h2>\n<p style=\"margin: 0; max-width: 560px; font-size: 19px; line-height: 1.55; color: #FFF1F1\">Give items, give your time, or partner with us. Every contribution keeps the circle turning.<\/p>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; position: relative\">\n<a href=\"https://wa.me/256795845815?text=Hello%20Msaada%2C%20I%20would%20like%20to%20donate%20some%20items.\" class=\"btn btn-white\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; background: #FFFFFF; color: #B71F1F; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: 999px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19z\"><\/path><path d=\"M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z\"><\/path><\/svg>Arrange on WhatsApp<\/a>\n<a href=\"Contact.dc.html\" class=\"btn\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border: 2px solid #FFFFFF; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: 999px\">Volunteer or partner<\/a>\n<\/div>\n<\/div>\n<\/section>\n\n<\/main>\n\n<dc-import name=\"Footer\" hint-size=\"100%,560px\"><\/dc-import>\n<\/div>", "defaults": {}, "code": "\nreturn class extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n"}, "About": {"tpl": "<div style=\"min-height: 100vh; display: flex; flex-direction: column\">\n\n<div style=\"position: sticky; top: 0; z-index: 50\">\n<dc-import name=\"Nav\" active=\"about\" hint-size=\"100%,96px\"><\/dc-import>\n<\/div>\n\n<main id=\"main\" tabindex=\"-1\" style=\"outline: none\">\n\n<!-- HERO -->\n<section style=\"padding: clamp(48px, 7vw, 104px) clamp(20px, 5vw, 72px) 0\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(46px, 7vw, 100px); line-height: .95; letter-spacing: -.04em; color: #0E4D2C\">Msaada means <span style=\"display: inline-flex; align-items: center; gap: .2em\"><span style=\"color: #D62828\">help.<\/span><img src=\"img/0214d3a08d3e3db48aa07c163e5da099.png\" alt=\"\" style=\"height: .8em; width: auto\"><\/span><\/h1>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-end\">\n<p style=\"margin: 0; flex: 1 1 480px; max-width: 640px; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.6; color: #33443A; width: 939px\">Msaada is a circular community support initiative. We collect useful items people no longer need, repair and reuse them, and redistribute or sell them at affordable prices to refugees and host community members.<\/p>\n<p style=\"margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; color: #D62828; transform: rotate(-3deg)\">Msaada \u00b7 \u0645\u0633\u0627\u0639\u062f\u0629 = help<\/p>\n<\/div>\n<div class=\"hero-strip\" style=\"display: grid; grid-template-columns: 2fr 1fr 1.3fr; gap: 16px\">\n<figure style=\"margin: 0; height: clamp(200px, 26vw, 380px); display: flex; align-items: flex-end; position: relative; overflow: hidden; background: #E3EDE5\"><img src=\"img/91d6bafe5f34786ebad333623a2c4bb2.jpg\" alt=\"Round thatched homes and chairs under a shade tree in a refugee settlement in Uganda\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block\"><\/figure>\n<figure style=\"margin: 0; height: clamp(200px, 26vw, 380px); display: flex; align-items: flex-end; position: relative; overflow: hidden; background: #E3EDE5\"><img src=\"img/298db25976508a68f138263b06ce6ad6.jpg\" alt=\"A young woman soldering an electronic circuit at an outdoor table\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 50%; display: block\"><\/figure>\n<figure style=\"margin: 0; height: clamp(200px, 26vw, 380px); display: flex; align-items: flex-end; position: relative; overflow: hidden; background: #E3EDE5\"><img src=\"img/3cb760b097869840822087dba34f23f8.jpg\" alt=\"A small shop with clothes on hangers and a tailor at work\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block\"><\/figure>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- WHY -->\n<section style=\"padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px, 6vw, 96px)\">\n<h2 style=\"margin: 0; flex: 1 1 360px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">Why Msaada was created<\/h2>\n<div style=\"flex: 1.4 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 19px; line-height: 1.65; color: #26372D\">Useful things are thrown away every day, while families nearby go without blankets, beds, school books or a working phone. At the same time, many young people are looking for practical skills and a way into work.<\/p>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.65; color: #26372D\">Msaada connects these needs. Donated items are collected, repaired by trained young people, then sold cheaply or given to those in need. Money from sales pays for the next round.<\/p>\n<sc-if value=\"{{ showFoundingStory }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-size: 19px; line-height: 1.65; color: #26372D\">[Msaada\u2019s founding story: when the initiative started, who started it and where it works.]<\/p>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- MISSION & VISION -->\n<section style=\"background: #0E4D2C; color: #FFFFFF; padding: clamp(56px, 7vw, 104px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 48px 72px\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\"><h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1; letter-spacing: -.03em; color: #FF8A8A\">Our mission<\/h2><p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.3; letter-spacing: -.01em; color: #FFFFFF\">To collect, reuse and redistribute useful items, reduce waste, and support individuals and communities in need, while creating skills and opportunities for young people.<\/p><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 18px\"><h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1; letter-spacing: -.03em; color: #FF8A8A\">Our vision<\/h2><p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.3; letter-spacing: -.01em; color: #FFFFFF\">A caring, sustainable and inclusive community where resources are shared, people are supported, and everyone has the opportunity to thrive.<\/p><\/div>\n<\/div>\n<\/section>\n\n<!-- TWO GOALS TOGETHER -->\n<section style=\"padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px); align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">Sustainability and social support work better together.<\/h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #26372D\">A mattress that stays in use is one less mattress in the dump. At Msaada, that same mattress goes to a family who needs it, after a young trainee has checked or fixed it.<\/p>\n<\/div>\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; justify-content: center\">\n<div role=\"img\" aria-label=\"Diagram: environmental sustainability and social support overlap, and Msaada sits where they meet\" style=\"position: relative; width: min(520px, 100%); aspect-ratio: 13 / 9\">\n<div style=\"position: absolute; left: 0; top: 0; width: 64%; aspect-ratio: 1 / 1; border-radius: 50%; background: #E8F2EA; border: 2px solid #0E4D2C; box-sizing: border-box; display: flex; align-items: center; padding-left: 9%; padding-right: 34%\"><p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(16px, 1.8vw, 22px); line-height: 1.15; color: #0E4D2C\">Environmental sustainability<\/p><\/div>\n<div style=\"position: absolute; right: 0; top: 0; width: 64%; aspect-ratio: 1 / 1; border-radius: 50%; border: 2px solid #D62828; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; padding-right: 9%; padding-left: 36%\"><p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(16px, 1.8vw, 22px); line-height: 1.15; color: #B71F1F; text-align: right\">Social support<\/p><\/div>\n<div style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -62%); width: 22%; aspect-ratio: 1 / 1; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #FAF7F0\"><img src=\"img/0214d3a08d3e3db48aa07c163e5da099.png\" alt=\"\" style=\"width: 72%; height: auto\"><\/div>\n<p style=\"position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; color: #0E4D2C; white-space: nowrap\">Msaada lives here<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- VALUES -->\n<section style=\"background: #E8F2EA; padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">What we stand for<\/h2>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0\">\n<li style=\"padding: 28px 24px 28px 0; border-top: 3px solid #0E4D2C; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 60px; height: 60px; border-radius: 50%; background: #0E4D2C; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 12.5l2.5 2.5a1.8 1.8 0 0 0 2.5-2.5\"><\/path><path d=\"M11 13.5l1.5 1.5a1.8 1.8 0 0 0 2.5-2.5L12 9.5 9.5 11a1.6 1.6 0 0 1-2-2.5L10.5 6a3 3 0 0 1 3 0L21 10.5\"><\/path><path d=\"M3 10.5 7 6.5l2 1\"><\/path><path d=\"M3 10.5l5.5 5.5M21 10.5l-3.5 3.5\"><\/path><\/svg><\/span>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Solidarity<\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">What one household no longer needs, another can use.<\/p>\n<\/li>\n<li style=\"padding: 28px 24px 28px 0; border-top: 3px solid #D62828; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 60px; height: 60px; border-radius: 50%; background: #D62828; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c0-9 6-14 15-14 0 9-5 15-14 15\"><\/path><path d=\"M5 19 13 11\"><\/path><\/svg><\/span>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Sustainability<\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Keeping useful items in use and out of the waste stream for as long as possible.<\/p>\n<\/li>\n<li style=\"padding: 28px 24px 28px 0; border-top: 3px solid #0E4D2C; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 60px; height: 60px; border-radius: 50%; background: #0E4D2C; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\/circle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\/path><circle cx=\"17\" cy=\"9\" r=\"2.5\"><\/circle><path d=\"M16 14.2c2.9.4 5 2.8 5 5.8\"><\/path><\/svg><\/span>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Inclusion<\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Refugee and host communities alike, with dignity and fair access for everyone.<\/p>\n<\/li>\n<li style=\"padding: 28px 24px 28px 0; border-top: 3px solid #D62828; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 60px; height: 60px; border-radius: 50%; background: #D62828; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21v-8\"><\/path><path d=\"M12 13c0-4 3-6 7-6 0 4-3 6-7 6z\"><\/path><path d=\"M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z\"><\/path><\/svg><\/span>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Opportunity<\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Practical skills and real work for young people through repair and preparation.<\/p>\n<\/li>\n<li style=\"padding: 28px 0; border-top: 3px solid #0E4D2C; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 60px; height: 60px; border-radius: 50%; background: #0E4D2C; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7\"><\/path><path d=\"M5 10v10h14V10\"><\/path><path d=\"M12 18s-3-1.9-3-4.2a1.7 1.7 0 0 1 3-1.1 1.7 1.7 0 0 1 3 1.1c0 2.3-3 4.2-3 4.2z\"><\/path><\/svg><\/span>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Community<\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Built with and for the people we serve.<\/p>\n<\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- IMPACT (moved from the Impact page) -->\n<section id=\"impact\" style=\"background: #FFFFFF; border-top: 1px solid #DCE6DE; padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 56px); line-height: 1.02; letter-spacing: -.03em; color: #0E4D2C\">Where your donation ends up<\/h2>\n<p style=\"margin: -24px 0 0; max-width: 620px; font-size: 18px; line-height: 1.6; color: #33443A\">A donated blanket keeps a family warm. A repaired phone gives a trainee practice and a buyer a phone that works. Small things like these add up across the settlement.<\/p>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); border-top: 1px solid #C9D9CD; border-left: 1px solid #C9D9CD\">\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7\"><\/path><path d=\"M5 10v10h14V10\"><\/path><path d=\"M10 20v-6h4v6\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Vulnerable families<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Household essentials (beds, blankets, utensils) at prices they can manage.<\/p><\/div><\/li>\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #FCE4E4; color: #B71F1F; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"><\/circle><path d=\"M12 8v7M7 11l5-2 5 2M9 21l3-6 3 6\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Children and young people<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Clothes, shoes and toys for children; repair skills and opportunities for youth.<\/p><\/div><\/li>\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 9l10-5 10 5-10 5z\"><\/path><path d=\"M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Students and schools<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Textbooks, exercise books and devices that help learners keep learning.<\/p><\/div><\/li>\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #FCE4E4; color: #B71F1F; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\/circle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\/path><circle cx=\"17\" cy=\"9\" r=\"2.5\"><\/circle><path d=\"M16 14.2c2.9.4 5 2.8 5 5.8\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Refugee and host communities<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Fair, affordable access to goods for everyone living in and around the settlement.<\/p><\/div><\/li>\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #E8F2EA; color: #0E4D2C; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">People in need<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Items that can\u2019t be resold are given directly to those who need them most.<\/p><\/div><\/li>\n<li style=\"padding: 32px; border-right: 1px solid #C9D9CD; border-bottom: 1px solid #C9D9CD; display: flex; gap: 20px; align-items: flex-start\"><span style=\"flex: 0 0 56px; height: 56px; border-radius: 50%; background: #FCE4E4; color: #B71F1F; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"10\" width=\"7\" height=\"11\"><\/rect><rect x=\"14\" y=\"4\" width=\"7\" height=\"17\"><\/rect><path d=\"M6 14h1M6 17h1M17 8h1M17 11h1M17 14h1\"><\/path><\/svg><\/span><div><h3 style=\"margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Community initiatives &amp; local organisations<\/h3><p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33443A\">Partners who share resources and reach more people together.<\/p><\/div><\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<sc-if value=\"{{ showFigures }}\" hint-placeholder-val=\"{{ false }}\">\n<!-- FIGURES -->\n<section style=\"padding: clamp(64px, 8vw, 120px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.05; letter-spacing: -.03em; color: #0E4D2C\">By the numbers<\/h2>\n<p style=\"margin: 0; font-size: 15px; color: #4A5A50\">Verified figures. Updated [MONTH YEAR].<\/p>\n<\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 3px solid #0E4D2C\">\n<div style=\"padding: 28px 24px 28px 0; display: flex; flex-direction: column-reverse; gap: 6px\"><dt style=\"font-size: 16px; font-weight: 600; color: #33443A\">Items collected<\/dt><dd style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 5vw, 72px); line-height: 1; color: #0E4D2C\">[\u2014]<\/dd><\/div>\n<div style=\"padding: 28px 24px 28px 0; display: flex; flex-direction: column-reverse; gap: 6px\"><dt style=\"font-size: 16px; font-weight: 600; color: #33443A\">Items repaired by young people<\/dt><dd style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 5vw, 72px); line-height: 1; color: #D62828\">[\u2014]<\/dd><\/div>\n<div style=\"padding: 28px 24px 28px 0; display: flex; flex-direction: column-reverse; gap: 6px\"><dt style=\"font-size: 16px; font-weight: 600; color: #33443A\">Households supported<\/dt><dd style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: e, "showStories": false}, "code": "\nreturn class extends DCLogic {\n  renderVals() {\n    const showFigures = this.props.showFigures ?? false;\n    return {\n      showFoundingStory: this.props.showFoundingStory ?? false,\n      showFigures: showFigures,\n      noFigures: !showFigures,\n      showStories: this.props.showStories ?? false\n    };\n  }\n}\n"}, "Sessions": {"tpl": "<div style=\"min-height: 100vh; display: flex; flex-direction: column\">\n\n<div style=\"position: sticky; top: 0; z-index: 50\">\n<dc-import name=\"Nav\" active=\"sessions\" hint-size=\"100%,96px\"><\/dc-import>\n<\/div>\n\n<main id=\"main\" tabindex=\"-1\" style=\"outline: none\">\n\n<!-- HERO -->\n<section style=\"padding: clamp(48px, 7vw, 104px) clamp(20px, 5vw, 72px) clamp(56px, 7vw, 96px)\">\n<div style=\"max-width: 1296px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(40px, 5vw, 80px); align-items: center\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 26px\">\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(46px, 7vw, 100px); line-height: .95; letter-spacing: -.04em; color: #0E4D2C\">Young people learning to <span style=\"color: #D62828\">repair<\/span> what you give.<\/h1>\n<p style=\"margin: 0; max-width: 540px; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.6; color: #33443A\">Training, repair workshops and community activities where young people and neighbours learn practical skills, often by fixing donated items.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"Contact.dc.html\" class=\"btn btn-red\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; background: #D62828; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: 999px\">Ask about a session<\/a>\n<\/div>\n<\/div>\n<div style=\"flex: 1 1 420px; min-width: 0; position: relative\">\n<figure style=\"margin: 0; dden=\"true\"><path d=\"M14.7 6.3a4 4 0 0 0 5 5l-8.4 8.4a2.1 2.1 0 0 1-3-3z\"><\/path><path d=\"M14.7 6.3 17 4l3 3-2.3 2.3\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px\"><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Youth repair &amp; practical skills training<\/h3><p style=\"margin: 0; font-size: 17px; line-height: 1.55; color: #33443A\">Hands-on training where young people learn to check, fix and prepare donated items, from phones and electronics to furniture, so they can be used again.<\/p><\/div>\n<\/li>\n\n<li class=\"row\" style=\"display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; padding: 28px 16px; border-bottom: 1px solid #C9D9CD\">\n<span style=\"flex: 0 0 64px; height: 64px; border-radius: 50%; background: #D62828; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z\"><\/path><path d=\"M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px\"><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #0E4D2C\">Community learning activities<\/h3><p style=\"margin: 0; font-size: 17px; line-height: 1.55; color: #33443A\">Open sessions where community members share knowledge and learn practical, everyday skills together.<\/p><\/div>\n<\/li>\n\n<li class=\"row\" style=\"display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; padding: 28px 16px; border-bottom: 1px solid #C9D9CD\">\n<span style=\"flex: 0 0 64px; height: 64px; border-radius: 50%; background: #0E4D2C; co e: 18px; line-height: 1.6; color: #CFE2D4\">Get in touch, tell us what you\u2019d like to give, and our team will arrange a convenient time to collect it from you.<\/p>\n<\/div>\n<ol style=\"flex: 1 1 460px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0\">\n<li style=\"display: flex; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid #1E5E3E\"><span style=\"flex: 0 0 44px; height: 44px; border-radius: 50%; background: #D62828; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800\">1<\/span><span style=\"font-size: 18px; font-weight: 600\">Call, WhatsApp or send us a message<\/span><\/li>\n<li style=\"display: flex; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid #1E5E3E\"><span style=\"flex: 0 0 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #0A3820; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800\">2<\/span><span style=\"font-size: 18px; font-weight: 600\">Tell us which items you\u2019d like to donate<\/span><\/li>\n<li style=\"display: flex; gap: 18px; align-items: center; padding: 18px 0\"><span style=\"flex: 0 0 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #0A3820; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800\">3<\/span><span style=\"font-size: 18px; font-weight: 600\">We arrange a collection time that suits you<\/span><\/li>\n<\/ol>\n<div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 12px\"><a href=\"https://wa.me/256795845815?text=Hello%20Msaada%2C%20I%20would%20like%20to%20donate%20some%20items.\" class=\"btn btn-red\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 32px; background: #D62828; color: #FFFFFF; font-weight: 700; f
